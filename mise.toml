# Crowsnest: tools and the task contract (setup, dev, build, test, lint, fmt, check).
# Agents and humans discover what this repo can do with `mise tasks`.

[tools]
go = "1.27.3"
node = "26.13.0"          # current LTS line
golangci-lint = "2.15.0"
goreleaser = "2.18.0"
uv = "0.13.7"              # runs web/scripts/terminal-fonts.py (fonts:terminal) with its pinned fonttools

[env]
CGO_ENABLED = "0"
# Go package patterns. Not ./... because web/node_modules can contain Go packages (flatted ships
# one) and the Go tool does not skip node_modules.
GO_PACKAGES = "./cmd/... ./internal/... ./web"

# ---- Setup -------------------------------------------------------------------

[tasks.setup]
description = "Zero to runnable: tools, Go modules, web dependencies. Idempotent"
run = [
  "mise install",
  "go mod download",
  # npm ci only when node_modules is missing or older than the lockfile, so a second run is a no-op.
  "if [ ! -f web/node_modules/.package-lock.json ] || [ web/package-lock.json -nt web/node_modules/.package-lock.json ]; then npm --prefix web ci --no-audit --no-fund; else echo 'web dependencies up to date'; fi",
]

# ---- Run ---------------------------------------------------------------------

[tasks.dev]
description = "The real thing, locally, as one binary on one port: builds ./bin/crowsnest (web app embedded) and runs it (no auth, http://localhost:2769) against its own herdr session crowsnest-dev (CROWSNEST_DEV_SESSION), with a real Claude orchestrator in .dev/orchestrator and its database in .dev/. A new directory shows Claude's folder-trust prompt once: answer it in the Terminal view. dev:hot is the Vite hot-reload variant; dev:demo needs no herdr or Claude. Long-running"
run = "bash scripts/dev.sh"

[tasks."dev:hot"]
description = "As dev, but for UI work: the Go server by go run on :2769 plus Vite with hot reload on :5173 (two ports). Long-running"
run = "CROWSNEST_DEV_HOT=1 bash scripts/dev.sh"

[tasks."dev:demo"]
description = "Go server (no auth, localhost, --demo fake herdr, throwaway state) on :2769 plus Vite on :5173 proxying /api to it. No herdr or Claude needed. Long-running"
run = """
#!/usr/bin/env bash
set -euo pipefail
trap 'kill 0' EXIT INT TERM
go run ./cmd/crowsnest serve --no-auth --web-dev --demo --port "${CROWSNEST_PORT:-2769}" &
npm --prefix web run dev
"""

[tasks."dev:container"]
description = "Build the devbox image for this arch (mise run image) and run it in the foreground: container crowsnest-dev (--rm), 127.0.0.1:2770 (CROWSNEST_DEV_CONTAINER_PORT), volume crowsnest-dev-home. First run: no login, so it starts in setup mode and the script prints the one-time setup link from its log; later runs use the login chosen there. Ctrl+C stops it. Needs Docker"
depends = ["image"]
run = "bash scripts/dev-container.sh"

[tasks."dev:container:reset"]
description = "Remove the crowsnest-dev container (if running) and its volumes (crowsnest-dev-home, which holds the login chosen at setup, and crowsnest-dev-secret left by older versions of dev:container)"
run = """
#!/usr/bin/env bash
set -euo pipefail
# docker rm -f succeeds even when there is no such container, so look first.
if [ -n "$(docker ps -aq --filter name=^crowsnest-dev$)" ]; then
  docker rm -f crowsnest-dev >/dev/null && echo "removed container crowsnest-dev"
fi
docker volume rm crowsnest-dev-home >/dev/null 2>&1 && echo "removed volume crowsnest-dev-home" || true
docker volume rm crowsnest-dev-secret >/dev/null 2>&1 && echo "removed volume crowsnest-dev-secret" || true
"""

[tasks.build]
description = "Build the web app, then the Go binary to ./bin/crowsnest with version ldflags"
run = """
#!/usr/bin/env bash
set -euo pipefail
npm --prefix web run build
VERSION="${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
LDFLAGS="-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.buildDate=$BUILD_DATE"
mkdir -p bin
go build -trimpath -ldflags="$LDFLAGS" -o bin/crowsnest ./cmd/crowsnest
echo "built bin/crowsnest $VERSION ($COMMIT)"
"""

[tasks."fonts:terminal"]
description = "Regenerate the terminal's fallback webfonts (web/src/fonts/terminal: Nerd Font symbols, DejaVu Sans Mono, Noto Sans Math and Symbols 2, chunked by unicode-range) from pinned sources. Downloads the Nerd Fonts release; the output is committed"
run = "uv run --script web/scripts/terminal-fonts.py"

# ---- Verify ------------------------------------------------------------------

[tasks.test]
description = "Go tests with -race, then the web unit tests (Vitest, single run). Non-interactive"
run = [
  "CGO_ENABLED=1 go test -race -count=1 $GO_PACKAGES",
  "npm --prefix web run test",
]

[tasks."test:integration"]
description = "Go integration tests against real herdr, in throwaway crowsnest-test-* sessions (the client, worktree.create, the terminal bridges, the fleet cache following events), plus self-update's real Sigstore verification of a published release (network). Needs herdr installed"
run = [
  "go vet -tags integration ./internal/herdr/... ./internal/term/... ./internal/orch/... ./internal/jobs/... ./internal/fleet/... ./internal/update/...",
  "CGO_ENABLED=1 go test -race -count=1 -tags integration -run Integration -v ./internal/herdr/... ./internal/term/... ./internal/fleet/... ./internal/update/...",
]

[tasks."test:claude"]
description = "Real-Claude smoke (costs a few cents): a real orchestrator on haiku in a throwaway crowsnest-test-* session answers one prompt through the HTTP API, calls the ask MCP tool, and answers a manual poke with one synthetic reason, does an `every: poke` scheduled task that rides a poke, starts with Remote Control and reports it active; reads a pasted image (a PNG with a word, uploaded and sent with a prompt) under the default permission mode and says the word; and the stop test: three haiku job agents (an undeclared stop is refused, done stops cleanly and its spend equals the transcript's own sums, a non-blocking ask is answered and the job finishes); and the approvals test: three haiku job agents under the default permission mode (a Bash call allowed through the API with no terminal answer, one denied with a note the agent quotes back, one refused by the guard hook with no approval asked); and a project lead (the built binary with --no-orchestrator: the lead answers with a SAY line, knows a codeword only its project instruction layer gives, holds and finishes a job given to the project, reports Remote Control active, and has the repository's CLAUDE.md recorded by the InstructionsLoaded hook); and the landing test: a haiku builder commits and calls done, the review gate starts a haiku reviewer in its worktree that reports read-only, then Land merges it (the base branch has the commit, the worktree is gone), and a job started while the automation is paused is not nudged; and the acceptance test: a haiku builder whose done fails crowsnest's own check gets the output back and fixes it (accepted, the evidence pinned to HEAD), a job over a one-minute budget is stopped at a safe point and needs you, and an agent that ends its turn asking in prose is refused and asks with the ask tool"
run = "CROWSNEST_E2E_CLAUDE=1 CGO_ENABLED=1 go test -count=1 -tags integration -run IntegrationClaude -v -timeout 35m ./internal/orch/... ./internal/jobs/... ./cmd/crowsnest/..."

[tasks."test:clone"]
description = "Prove a clean clone builds: clone HEAD into a temporary directory, then mise run setup and mise run build there (nothing from this checkout's node_modules, bin or web/dist). Slow: a full npm ci"
run = """
#!/usr/bin/env bash
set -euo pipefail
src="$PWD"
head="$(git -C "$src" rev-parse HEAD)"
dir="$(mktemp -d "${TMPDIR:-/tmp}/crowsnest-clone.XXXXXX")"
trap 'rm -rf "$dir"' EXIT
git clone --quiet --no-local "$src" "$dir/crowsnest"
git -C "$dir/crowsnest" checkout --quiet "$head"
mise trust --quiet "$dir/crowsnest/mise.toml"
mise -C "$dir/crowsnest" run setup
mise -C "$dir/crowsnest" run build
"$dir/crowsnest/bin/crowsnest" version
echo "clean clone at ${head:0:7}: setup and build OK"
"""

[tasks.lint]
description = "go vet, golangci-lint, gofmt check, tsc, eslint. Read-only"
run = [
  "go vet $GO_PACKAGES",
  "golangci-lint run $GO_PACKAGES",
  "test -z \"$(gofmt -l cmd internal web/*.go)\" || { echo 'gofmt needed on:'; gofmt -l cmd internal web/*.go; exit 1; }",
  "npm --prefix web run typecheck",
  "npm --prefix web run lint",
]

[tasks.fmt]
description = "Format Go (gofmt) and web code (eslint --fix). Mutates"
run = [
  "gofmt -w cmd internal web/*.go",
  "npm --prefix web run lint -- --fix",
]

[tasks.check]
description = "The done-gate: lint and test"
depends = ["lint", "test"]

[tasks.e2e]
description = "The hermetic browser suite: Playwright against the built binary in --demo (a fresh instance per test; the auth specs with the login on), desktop Chromium 1440x900 plus 375x812 Chromium and WebKit. Report in web/playwright-report"
depends = ["build"]
run = "npm --prefix web run e2e"

[tasks."e2e:real"]
description = "Build, then Playwright against the real binary (web/e2e/real): --demo fleet, and terminals on a throwaway herdr session. Needs herdr"
run = [
  "mise run build",
  "npm --prefix web run e2e:real",
]

[tasks."e2e:claude"]
description = "Real Claude through the browser (opt-in, costs a few cents, haiku; about 10 minutes): a job given from Now for a project is checked by crowsnest, reviewed by a Claude reviewer, accepted, reviewed on the Review tab and merged with Land; a failed check goes back to the agent and is fixed; a question answered from its decision packet at 390x844 with the receipt reaching Received; a nudge on the timeline; a prose question turned into a real one; pause and resume; approvals allowed and denied from the tray (manual permission mode); a project created in the UI with its lead started, chatted with, Open in Claude, and a job it finishes; a chat reply and `crowsnest ask --wait` from the orchestrator's pane; and a true first run (setup link, password, checklist, Start, the folder-trust card, Chat greeting). Throwaway crowsnest-test-* herdr sessions, your real HOME for Claude's login"
depends = ["build"]
run = "npm --prefix web run e2e:claude"

[tasks.screenshots]
description = "Fleet view with fixtures at 375 and 1440 px, light and dark, into web/screenshots; plus the 375 px layout checks"
run = "npm --prefix web run screenshots"

[tasks."screenshots:inbox"]
description = "Inbox against the built binary in --demo mode (seeded questions, a mermaid body, a diff, a dialog) at 375 and 1440 px, light and dark, into web/screenshots; plus an answer round trip"
depends = ["build"]
run = "npm --prefix web run screenshots:inbox"

[tasks."screenshots:jobs"]
description = "Jobs view against the built binary in --demo mode (a job in every state, one nudged, one stuck on a limit) at 375 and 1440 px: the board, the new-job form, a running and a stuck job; plus giving a job"
depends = ["build"]
run = "npm --prefix web run screenshots:jobs"

[tasks."screenshots:palette"]
description = "Command palette against the built binary in --demo mode at 375 and 1440 px, light and dark: open, with a query, a job's actions, and the keyboard shortcuts sheet, into web/screenshots"
depends = ["build"]
run = "npm --prefix web run screenshots:palette"

[tasks."screenshots:chat"]
description = "Chat view against the built binary in --demo mode (a real prompt round trip) at 375 and 1440 px, light and dark, into web/screenshots"
depends = ["build"]
run = "npm --prefix web run screenshots:chat"

[tasks."e2e:voice"]
description = "Talk mode alone (it is also part of e2e): the built binary in --demo mode and a fake ElevenLabs (never the real one), Chromium's fake microphone and WebKit's mock one: the mic, transcript sent, SAY reply played with speak mode on, hold Space with real key events, the Voice sheet; plus Chat-recording screenshots at 375 and 1440 px into web/screenshots"
depends = ["build"]
run = "npm --prefix web run e2e:voice"

# ---- Ship --------------------------------------------------------------------

[tasks.snapshot]
description = "Prove the release packaging locally: GoReleaser snapshot into dist/ (four archives, checksums, the Homebrew cask), nothing signed or published"
# .goreleaser.yml's before-hook builds the web app, so this is the whole job. A snapshot never
# publishes (so the tap is not pushed); signing is skipped explicitly, because keyless cosign
# outside CI would start a browser login and write this machine's identity to the public log.
run = "goreleaser release --snapshot --clean --skip=sign"

[tasks.image]
description = "Build the devbox image (deploy/Dockerfile) for this machine's arch as crowsnest:dev. Needs Docker"
run = """
#!/usr/bin/env bash
set -euo pipefail
VERSION="${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
docker build -f deploy/Dockerfile \
  --build-arg VERSION="$VERSION" \
  --build-arg COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)" \
  --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
  -t crowsnest:dev .
# raw: the run script is a Tera template, and Docker's Go template braces would collide with it.
echo "built crowsnest:dev $VERSION ($(docker image inspect crowsnest:dev --format '{% raw %}{{.Size}}{% endraw %}' | awk '{printf "%.0f MB", $1/1000000}'))"
"""

# No `usage` spec, so `mise run publish -- v1.2.3` reaches the script as $1.
[tasks.publish]
description = "Build the devbox image for amd64 and arm64 and push ghcr.io/jclement/crowsnest:<version> and :latest. Token from GHCR_TOKEN or gh. Jeff's step"
run = "bash deploy/publish.sh"

[tasks.release]
description = "Interactive release: bump version, tag, and push. Jeff's step"
run = """
#!/bin/bash
set -e

CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
echo "Current version: $CURRENT_TAG"

VERSION_NUM=${CURRENT_TAG#v}
IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUM"

NEXT_PATCH="v$MAJOR.$MINOR.$((PATCH + 1))"
NEXT_MINOR="v$MAJOR.$((MINOR + 1)).0"
NEXT_MAJOR="v$((MAJOR + 1)).0.0"

echo ""
echo "Select release type:"
echo "  1) patch  → $NEXT_PATCH"
echo "  2) minor  → $NEXT_MINOR"
echo "  3) major  → $NEXT_MAJOR"
echo "  q) quit"
echo ""
read -p "Choice [1]: " CHOICE
CHOICE=${CHOICE:-1}

case $CHOICE in
    1) NEW_VERSION=$NEXT_PATCH ;;
    2) NEW_VERSION=$NEXT_MINOR ;;
    3) NEW_VERSION=$NEXT_MAJOR ;;
    q|Q) echo "Cancelled."; exit 0 ;;
    *) echo "Invalid choice"; exit 1 ;;
esac

echo ""
echo "Creating release: $NEW_VERSION"
git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
echo "Created tag: $NEW_VERSION"

read -p "Push tag to origin? [Y/n]: " CONFIRM
CONFIRM=${CONFIRM:-Y}
if [[ ! $CONFIRM =~ ^[Yy]$ ]]; then
    git tag -d "$NEW_VERSION" >/dev/null 2>&1
    echo "Cancelled. Tag removed."
    exit 0
fi

git push origin "$NEW_VERSION"
echo "Tag pushed! GitHub Actions will build and release."
"""

[tasks."dev:reset"]
description = "Blow away local state: build output, web dist, Vite cache, .dev/ (dev database and orchestrator dir), and stop and delete the crowsnest-dev herdr session (only that one, by exact name) with its state dir"
run = "bash scripts/dev-reset.sh"

# ---- Promo film (promo/README.md) ---------------------------------------------
# The narrated walkthrough, recorded from the real app in --demo. `mise run promo` does it all;
# the stages are separate so one can be redone. Heavy (Chromium + ffmpeg): run under `heavy`.

[tasks."promo:setup"]
description = "Promo film: Python deps (uv) and Playwright's Chromium. Needs mise run setup first (the recorder uses web/node_modules)"
dir = "promo"
run = ["uv sync --quiet", "npx --prefix ../web playwright install chromium"]

[tasks."promo:voice"]
description = "Promo film: perform the narration lines that have no cached clip in promo/voice/ (ElevenLabs; key from ELEVENLABS_API_KEY, promo/.env or ~/Downloads/eleven.env) and write out/timeline.json. `-- --fake` needs no key"
dir = "promo"
run = "uv run --quiet scripts/voice.py"

[tasks."promo:record"]
description = "Promo film: record every scene from ./bin/crowsnest --demo into promo/out/clips/ (`-- give nudge` for some), and draw the caption plates"
dir = "promo"
run = "node recorder/record.mjs"

[tasks."promo:music"]
description = "Promo film: compose the music bed (promo/out/audio/bed.wav)"
dir = "promo"
run = "uv run --quiet scripts/music.py"

[tasks."promo:assemble"]
description = "Promo film: mix, caption and encode promo/out/crowsnest-tour.mp4 (+ .srt, promo/contact-sheet.png) and copy it to ~/Downloads (`-- --no-copy` not)"
dir = "promo"
run = "uv run --quiet scripts/assemble.py"

[tasks.promo]
description = "Promo film, start to finish: build, voice, record, music, assemble"
depends = ["build"]
dir = "promo"
run = [
  "uv run --quiet scripts/voice.py",
  "node recorder/record.mjs",
  "uv run --quiet scripts/music.py",
  "uv run --quiet scripts/assemble.py",
]
