# Crowsnest: tools and the task contract (setup, dev, build, test, lint, fmt, check).
# Agents and humans discover what this repo can do with `mise tasks`.

[tools]
go = "1.27.3"
node = "26.13.0"          # current LTS line
golangci-lint = "2.15.0"
goreleaser = "2.18.0"

[env]
CGO_ENABLED = "0"
# Go package patterns. Not ./... because web/node_modules can contain Go packages (flatted ships
# one) and the Go tool does not skip node_modules.
GO_PACKAGES = "./cmd/... ./internal/... ./web"

# ---- Setup -------------------------------------------------------------------

[tasks.setup]
description = "Zero to runnable: tools, Go modules, web dependencies. Idempotent"
run = [
  "mise install",
  "go mod download",
  # npm ci only when node_modules is missing or older than the lockfile, so a second run is a no-op.
  "if [ ! -f web/node_modules/.package-lock.json ] || [ web/package-lock.json -nt web/node_modules/.package-lock.json ]; then npm --prefix web ci --no-audit --no-fund; else echo 'web dependencies up to date'; fi",
]

# ---- Run ---------------------------------------------------------------------

[tasks.dev]
description = "Go server (no auth, localhost, --demo fake herdr) on :2769 plus Vite on :5173 proxying /api to it. Long-running"
run = """
#!/usr/bin/env bash
set -euo pipefail
trap 'kill 0' EXIT INT TERM
CROWSNEST_DATA_DIR="${CROWSNEST_DATA_DIR:-$PWD/.dev}" \
  go run ./cmd/crowsnest serve --no-auth --web-dev --demo --port "${CROWSNEST_PORT:-2769}" &
npm --prefix web run dev
"""

[tasks.build]
description = "Build the web app, then the Go binary to ./bin/crowsnest with version ldflags"
run = """
#!/usr/bin/env bash
set -euo pipefail
npm --prefix web run build
VERSION="${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
LDFLAGS="-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.buildDate=$BUILD_DATE"
mkdir -p bin
go build -trimpath -ldflags="$LDFLAGS" -o bin/crowsnest ./cmd/crowsnest
echo "built bin/crowsnest $VERSION ($COMMIT)"
"""

# ---- Verify ------------------------------------------------------------------

[tasks.test]
description = "Go tests with -race, then the web unit tests (Vitest, single run). Non-interactive"
run = [
  "CGO_ENABLED=1 go test -race -count=1 $GO_PACKAGES",
  "npm --prefix web run test",
]

[tasks."test:integration"]
description = "Go integration tests against real herdr, in throwaway crowsnest-test-* sessions. Needs herdr installed"
run = [
  "go vet -tags integration ./internal/herdr/... ./internal/term/... ./internal/orch/... ./internal/jobs/...",
  "CGO_ENABLED=1 go test -race -count=1 -tags integration -run Integration -v ./internal/herdr/... ./internal/term/...",
]

[tasks."test:claude"]
description = "Real-Claude smoke (costs a few cents): a real orchestrator on haiku in a throwaway crowsnest-test-* session answers one prompt through the HTTP API and calls the ask MCP tool; and the stop test: three haiku job agents (an undeclared stop is refused, done stops cleanly, a non-blocking ask is answered and the job finishes)"
run = "CROWSNEST_E2E_CLAUDE=1 CGO_ENABLED=1 go test -count=1 -tags integration -run IntegrationClaude -v -timeout 15m ./internal/orch/... ./internal/jobs/..."

[tasks.lint]
description = "go vet, golangci-lint, gofmt check, tsc, eslint. Read-only"
run = [
  "go vet $GO_PACKAGES",
  "golangci-lint run $GO_PACKAGES",
  "test -z \"$(gofmt -l cmd internal web/*.go)\" || { echo 'gofmt needed on:'; gofmt -l cmd internal web/*.go; exit 1; }",
  "npm --prefix web run typecheck",
  "npm --prefix web run lint",
]

[tasks.fmt]
description = "Format Go (gofmt) and web code (eslint --fix). Mutates"
run = [
  "gofmt -w cmd internal web/*.go",
  "npm --prefix web run lint -- --fix",
]

[tasks.check]
description = "The done-gate: lint and test"
depends = ["lint", "test"]

[tasks.e2e]
description = "Playwright end-to-end suite against crowsnest --demo"
run = "echo 'e2e: not built until M9 (DESIGN.md section 17)' >&2; exit 1"

[tasks."e2e:real"]
description = "Build, then Playwright against the real binary (web/e2e/real): --demo fleet, and terminals on a throwaway herdr session. Needs herdr"
run = [
  "mise run build",
  "npm --prefix web run e2e:real",
]

[tasks.screenshots]
description = "Fleet view with fixtures at 375 and 1440 px, light and dark, into web/screenshots; plus the 375 px layout checks"
run = "npm --prefix web run screenshots"

[tasks."screenshots:inbox"]
description = "Inbox against the built binary in --demo mode (seeded questions, a mermaid body, a diff, a dialog) at 375 and 1440 px, light and dark, into web/screenshots; plus an answer round trip"
depends = ["build"]
run = "npm --prefix web run screenshots:inbox"

[tasks."screenshots:jobs"]
description = "Jobs view against the built binary in --demo mode (a job in every state, one nudged, one stuck on a limit) at 375 and 1440 px: the board, the new-job form, a running and a stuck job; plus giving a job"
depends = ["build"]
run = "npm --prefix web run screenshots:jobs"

[tasks."screenshots:chat"]
description = "Chat view against the built binary in --demo mode (a real prompt round trip) at 375 and 1440 px, light and dark, into web/screenshots"
depends = ["build"]
run = "npm --prefix web run screenshots:chat"

[tasks."e2e:voice"]
description = "Talk mode against the built binary in --demo mode and a fake ElevenLabs (never the real one), with Chromium's fake microphone: hold to talk, transcript sent, SAY reply played; plus Chat-with-talk screenshots at 375 and 1440 px into web/screenshots"
depends = ["build"]
run = "npm --prefix web run e2e:voice"

# ---- Ship --------------------------------------------------------------------

[tasks.snapshot]
description = "Prove the release packaging locally: GoReleaser snapshot into dist/ (four archives, checksums), nothing published"
# .goreleaser.yml's before-hook builds the web app, so this is the whole job.
run = "goreleaser release --snapshot --clean"

[tasks.image]
description = "Build the devbox image (deploy/Dockerfile) for this machine's arch as crowsnest:dev. Needs Docker"
run = """
#!/usr/bin/env bash
set -euo pipefail
VERSION="${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
docker build -f deploy/Dockerfile \
  --build-arg VERSION="$VERSION" \
  --build-arg COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)" \
  --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
  -t crowsnest:dev .
# raw: the run script is a Tera template, and Docker's Go template braces would collide with it.
echo "built crowsnest:dev $VERSION ($(docker image inspect crowsnest:dev --format '{% raw %}{{.Size}}{% endraw %}' | awk '{printf "%.0f MB", $1/1000000}'))"
"""

# No `usage` spec, so `mise run publish -- v1.2.3` reaches the script as $1.
[tasks.publish]
description = "Build the devbox image for amd64 and arm64 and push ghcr.io/jclement/crowsnest:<version> and :latest. Token from GHCR_TOKEN or gh. Jeff's step"
run = "bash deploy/publish.sh"

[tasks.release]
description = "Interactive release: bump version, tag, and push. Jeff's step"
run = """
#!/bin/bash
set -e

CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
echo "Current version: $CURRENT_TAG"

VERSION_NUM=${CURRENT_TAG#v}
IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUM"

NEXT_PATCH="v$MAJOR.$MINOR.$((PATCH + 1))"
NEXT_MINOR="v$MAJOR.$((MINOR + 1)).0"
NEXT_MAJOR="v$((MAJOR + 1)).0.0"

echo ""
echo "Select release type:"
echo "  1) patch  → $NEXT_PATCH"
echo "  2) minor  → $NEXT_MINOR"
echo "  3) major  → $NEXT_MAJOR"
echo "  q) quit"
echo ""
read -p "Choice [1]: " CHOICE
CHOICE=${CHOICE:-1}

case $CHOICE in
    1) NEW_VERSION=$NEXT_PATCH ;;
    2) NEW_VERSION=$NEXT_MINOR ;;
    3) NEW_VERSION=$NEXT_MAJOR ;;
    q|Q) echo "Cancelled."; exit 0 ;;
    *) echo "Invalid choice"; exit 1 ;;
esac

echo ""
echo "Creating release: $NEW_VERSION"
git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
echo "Created tag: $NEW_VERSION"

read -p "Push tag to origin? [Y/n]: " CONFIRM
CONFIRM=${CONFIRM:-Y}
if [[ ! $CONFIRM =~ ^[Yy]$ ]]; then
    git tag -d "$NEW_VERSION" >/dev/null 2>&1
    echo "Cancelled. Tag removed."
    exit 0
fi

git push origin "$NEW_VERSION"
echo "Tag pushed! GitHub Actions will build and release."
"""

[tasks."dev:reset"]
description = "Blow away local state: build output, web dist, Vite cache, the dev database"
run = [
  "rm -rf bin dist .dev web/node_modules/.vite",
  "find web/dist -mindepth 1 ! -name .gitkeep -delete 2>/dev/null || true",
  "echo 'local state cleared (web/node_modules kept; run mise run setup to reinstall)'",
]
