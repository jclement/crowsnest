# CI: the same gate as local work. mise installs the pinned toolchain from mise.toml, setup
# installs Go modules and web dependencies, and check runs lint and the full test suite. Actions
# are pinned to full commit SHAs with the tag in a comment (R1 M3; see release.yml).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true
      - name: Setup
        run: mise run setup
      - name: Check
        run: mise run check

  # The hermetic browser suite (DESIGN.md 15): Playwright against the built binary in --demo,
  # desktop Chromium plus phone-sized Chromium and WebKit. Browsers come from Playwright's own
  # installer at the version web/package-lock.json pins (with the system libraries WebKit needs);
  # the HTML report is uploaded when the suite fails. 30 minutes: setup and the browser install take
  # about 5 and the suite about 14 on a runner, and a slower runner was cut off at 20 while still
  # passing.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true
      - name: Setup
        run: mise run setup
      - name: Install browsers
        run: npx --prefix web playwright install --with-deps chromium webkit
      - name: E2E
        run: mise run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
