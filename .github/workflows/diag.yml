# TEMPORARY (wip/ci): diagnostics for the Linux-only Go test failures. Removed before the branch
# is finished.
name: diag

on:
  push:
    branches: [wip/ci]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true
      - name: Setup
        run: mise run setup
      - name: Machine
        run: |
          set -x
          id; nproc; free -m; df -h / /tmp; mount | grep -E ' on (/|/tmp) '; ulimit -a
          echo "TMPDIR=${TMPDIR:-unset}"; ls -ld /tmp; cat /proc/sys/fs/inotify/max_user_instances /proc/sys/fs/inotify/max_user_watches
          command -v herdr claude || true
      - name: noherdr alone under strace
        if: always()
        run: |
          sudo apt-get install -y strace >/dev/null 2>&1 || true
          CGO_ENABLED=1 mise exec -- go test -race -c -o /tmp/cmdtest ./cmd/crowsnest
          cd cmd/crowsnest
          strace -f -o /tmp/strace.txt -e trace=%file,write,pwrite64,ftruncate,fallocate,fcntl /tmp/cmdtest -test.run 'TestServeStartsWithoutHerdrAndRecovers$' -test.v -test.count=1 2>&1 | tail -40 || true
          grep -nE 'crowsnest-test-noherdr|= -1 E' /tmp/strace.txt | grep -v ENOENT | head -120 || true
      - name: noherdr alone x5
        if: always()
        run: cd cmd/crowsnest && /tmp/cmdtest -test.run 'TestServeStartsWithoutHerdrAndRecovers$' -test.count=5 2>&1 | tail -20
      - name: cmd/crowsnest whole package, verbose
        if: always()
        run: cd cmd/crowsnest && /tmp/cmdtest -test.v -test.timeout 15m 2>&1 | grep -E '^(=== RUN|--- |PASS|FAIL|ok|panic)|noherdr|disk I/O' | tail -150
      - name: orch fleet events x5
        if: always()
        run: CGO_ENABLED=1 mise exec -- go test -race -run 'TestRunFollowsFleetEvents$' -count=5 -v ./internal/orch 2>&1 | tail -60
      - name: orch fleet events x20 against main's orch.go (before the fix)
        if: always()
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:internal/orch/orch.go > internal/orch/orch.go
          CGO_ENABLED=1 mise exec -- go test -race -run 'TestRunFollowsFleetEvents$' -count=20 ./internal/orch 2>&1 | grep -E 'not yet subscribed|did not refresh|^ok|^FAIL|^---' | sort | uniq -c
