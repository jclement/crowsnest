# Release: a `v*` tag (pushed by `mise run release`, Jeff's step) runs the same gate as CI, then
# GoReleaser builds the linux and darwin archives and checksums and attaches them to a GitHub
# release (DESIGN.md section 16, .goreleaser.yml). Only GITHUB_TOKEN is used: cosign and the
# Homebrew tap are deferred while the repo is private (DESIGN.md section 19 item 4).
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the changelog and version come from tags and history
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - name: Setup
        run: mise run setup
      - name: Check
        run: mise run check
      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.0 # keep in step with goreleaser in mise.toml, which `mise run snapshot` uses
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The devbox image (deploy/Dockerfile, DESIGN.md section 16), only once the binaries released:
  # a tag whose gate failed must not leave an image behind. Both architectures from one runner:
  # the web and Go stages run natively and cross-compile; only the runtime stage's apt and
  # downloads run under QEMU for arm64.
  image:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: version
        # The same stamps the binaries carry: the tag as the version, short commit, build time.
        run: |
          {
            echo "version=${GITHUB_REF_NAME}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 and latest; a prerelease tag (v0.1.0-rc.1) gets its own tag but not latest.
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=crowsnest
            org.opencontainers.image.description=crowsnest devbox: herdr, mise and Claude Code behind a web UI
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
