# Release: a `v*` tag (pushed by `mise run release`, Jeff's step) runs the same gate as CI, then
# GoReleaser builds the linux and darwin archives and checksums, signs checksums.txt with keyless
# cosign, attaches them to a GitHub release and pushes the cask to jclement/homebrew-tap
# (DESIGN.md section 16, .goreleaser.yml). Secrets: GITHUB_TOKEN, and HOMEBREW_TAP_TOKEN (a PAT
# that can write the tap repository) in the release job only.
#
# Two jobs, so the write-scoped token never meets third-party code (R1 M3):
#
#   - check (contents: read) installs everything, runs the gate, builds the web app and hands
#     web/dist on as an artifact. npm install scripts and the test suite run here, where the
#     token can only read.
#   - release (contents: write, id-token: write) checks out without persisting credentials,
#     installs only Go and cosign, takes the built web app, and runs GoReleaser with its
#     before-hook (the web build) skipped. No npm install, no tests, no restored cache that
#     another ref could have written. id-token is what keyless cosign signs with: the OIDC token
#     names this repository and workflow, and that identity is what `crowsnest update` and
#     `cosign verify-blob` check. It is granted to this job alone.
#
# Every action is pinned to a full commit SHA with its tag in a comment; a tag can be moved by
# whoever controls the action's repository, a SHA cannot. To update one, look up the new tag's
# commit (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`, resolving an annotated tag to its
# commit) and change both.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true
      - name: Setup
        run: mise run setup
      - name: Check
        run: mise run check
      - name: Build the web app
        run: npm --prefix web run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write # keyless cosign: sign checksums.txt with this workflow's OIDC identity
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the changelog and version come from tags and history
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          install_args: go # GoReleaser needs only Go; node and the rest stay out of this job
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: web/dist
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.0 # keep in step with goreleaser in mise.toml, which `mise run snapshot` uses
          # The before-hook builds the web app; the check job already did, so it is skipped here
          # and nothing from npm runs next to the write token.
          args: release --clean --skip=before
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # The devbox image (deploy/Dockerfile, DESIGN.md section 16), only once the binaries released:
  # a tag whose gate failed must not leave an image behind. Both architectures from one runner:
  # the web and Go stages run natively and cross-compile; only the runtime stage's apt and
  # downloads run under QEMU for arm64.
  image:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Version
        id: version
        # The same stamps the binaries carry: the tag as the version, short commit, build time.
        run: |
          {
            echo "version=${GITHUB_REF_NAME}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 and latest; a prerelease tag (v0.1.0-rc.1) gets its own tag but not latest.
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=crowsnest
            org.opencontainers.image.description=crowsnest devbox: herdr, mise and Claude Code behind a web UI
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
