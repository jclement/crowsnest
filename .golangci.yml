# golangci-lint v2. The standard set plus a few that catch real bugs in this kind of server.
version: "2"
linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers this with better exclusions
        - G304 # file paths from config: reading the user's own files is the point
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, bodyclose]
formatters:
  enable:
    - gofmt
