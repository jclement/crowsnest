# GoReleaser v2: what a `v*` tag turns into (DESIGN.md section 16). The release workflow runs
# this on a tag; `mise run snapshot` runs it locally without publishing. Never run
# `goreleaser release` by hand without --snapshot: releases are `mise run release`, then CI.
#
# Structure copied from ~/Developer/drillbit/.goreleaser.yml (signing) and the newer
# repositories' homebrew_casks (herdr-web, herdrer). Windows is not built: PTYs and
# unix sockets make it a different product (DESIGN.md section 19 item 6).
version: 2

project_name: crowsnest

before:
  hooks:
    # The binary embeds web/dist (web/embed.go). Without this the build would carry only the
    # placeholder and `serve` would refuse to start. Needs web/node_modules (`mise run setup`).
    - npm --prefix web run build

builds:
  - id: crowsnest
    main: ./cmd/crowsnest
    binary: crowsnest
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # The same variables `mise run build` stamps. The "v" keeps the version reading like
    # `git describe` output (v1.2.3), which is what the local build prints.
    ldflags:
      - -s -w
      - -X main.version=v{{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.buildDate={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^Merge branch"

release:
  github:
    owner: jclement
    name: crowsnest
  draft: false
  prerelease: auto

# ---- Signing ------------------------------------------------------------------------------
# Cosign keyless over checksums.txt: the release job's GitHub OIDC identity is the signer, so
# there is no key to keep. checksums.txt.sigstore.json is what `crowsnest update` verifies (TUF
# root, Fulcio certificate for this repository's workflow, Rekor entry) before it trusts any
# checksum, and what the README's `cosign verify-blob` example checks by hand. Needs
# `id-token: write` on the release job and cosign on PATH (sigstore/cosign-installer).
# `mise run snapshot` passes --skip=sign: a local keyless sign would open a browser login.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# ---- Homebrew -------------------------------------------------------------------------------
# `brew install jclement/tap/crowsnest`. GoReleaser 2.17 deprecated `brews:` for casks, as the
# newer repositories use. The push needs HOMEBREW_TAP_TOKEN (a repository secret, Jeff's to
# set); a snapshot only writes the cask into dist/homebrew. herdr is in homebrew-core, so the cask
# depends on that formula: crowsnest cannot run without it.
homebrew_casks:
  - name: crowsnest
    directory: Casks
    repository:
      owner: jclement
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/jclement/crowsnest"
    description: "Run a herdr session and its Claude Code orchestrator from a browser"
    license: "MIT"
    dependencies:
      - formula: herdr
    hooks:
      post:
        # Strip the quarantine flag Gatekeeper puts on an unnotarised download, so the binary
        # runs without the right-click-open dance.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/crowsnest"]
          end
