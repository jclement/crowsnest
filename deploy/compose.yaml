# The crowsnest devbox (DESIGN.md section 16). From the repo root:
#
#   cp deploy/crowsnest.env.sample deploy/crowsnest.env
#   docker compose -f deploy/compose.yaml up -d
#   docker compose -f deploy/compose.yaml logs crowsnest | grep 'setup#token'
#
# On first start crowsnest has no login, so it starts locked and serves only a setup page; the
# log holds the link to it, with a one-time token (new at every start until setup is done).
# Open the link (it says localhost:2769, the port published below), choose a username and
# password, and you are signed in. Then open Terminal and run `claude` once to sign Claude in.
# The login is stored in the volume; `docker compose exec crowsnest crowsnest reset-password`
# sets a new one. Anyone who can read this container's logs can complete setup before you, which
# is why the port is loopback-only and the token is never in a response or a URL a proxy logs.
#
# Unattended installs (no browser step): set CROWSNEST_USERNAME in crowsnest.env, write the
# password to deploy/crowsnest_password (mode 0600, owned by uid 1000) and uncomment the
# `environment:` and `secrets:` lines below and the top-level `secrets:` block. A login given
# this way wins over a stored one, and the Account sheet shows it read-only.
#
# Blast radius, plainly: whoever logs in has a shell as `crow` in this container, and so does
# every agent running in it. They reach exactly what is mounted (the /home/crow volume, plus
# anything you add below) and whatever the container's network reaches, which by default is
# the internet and your LAN. Mount nothing you would not hand an agent: never the Docker
# socket, never your real home directory or ~/.ssh. To narrow the network too, put the service
# on an `internal: true` network behind a proxy you control.
#
# Secrets, plainly (R1b N1): agents run as the same user as crowsnest, so anything in the
# crowsnest container's environment is readable by them (/proc/1/environ). Hence a configured
# password is a mounted file, not a variable (a login chosen at setup is in neither), and each sidecar keeps its token in its own env file: a token
# in crowsnest.env would hand the tunnel (and with it the login page's traffic) or the tailnet to
# any prompt-injected agent. A same-user file is readable by agents too; the only hard boundary
# would be a separate uid for crowsnest, which this image does not have (DESIGN.md section 4).

services:
  crowsnest:
    image: ghcr.io/jclement/crowsnest:latest
    # build: { context: .., dockerfile: deploy/Dockerfile }   # or build it from this checkout
    env_file: crowsnest.env
    # Unattended installs only (see the top of this file):
    # environment:
    #   CROWSNEST_PASSWORD_FILE: /run/secrets/crowsnest_password
    # secrets: [crowsnest_password]
    volumes:
      # Everything that should survive an image upgrade: Claude's login, mise's tools, herdr's
      # sessions, crowsnest's database, and your projects (clone them under /home/crow).
      - crowsnest-home:/home/crow
    ports:
      # Loopback only. A web terminal is a shell; reach it from elsewhere through a tunnel or
      # tailnet (below), not by publishing it on every interface.
      - "127.0.0.1:2769:2769"
    restart: unless-stopped
    stop_grace_period: 30s

  # ---- Optional: a Cloudflare tunnel instead of a published port -----------------------------
  # Remove `ports:` above, put TUNNEL_TOKEN=... in deploy/cloudflared.env (never in
  # crowsnest.env), point the tunnel's public hostname at http://localhost:2769, and tell
  # crowsnest that hostname is allowed and that the tunnel on loopback is a trusted proxy:
  #   CROWSNEST_ALLOWED_HOSTS=crowsnest.example.com
  #   CROWSNEST_TRUSTED_PROXY=loopback
  #   CROWSNEST_TRUSTED_PROXY_HEADER=cf-connecting-ip
  # The tunnel shares crowsnest's network namespace, so every internet client reaches crowsnest
  # from 127.0.0.1. Without CROWSNEST_TRUSTED_PROXY they would share one login rate-limit bucket
  # (five bad passwords a minute from anyone would lock you out) and escape the per-client cap;
  # with it, crowsnest keys both on the CF-Connecting-IP cloudflared passes on (R2-L2).
  # Put Cloudflare Access in front as well; the crowsnest login should not be the only gate.
  #
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel --no-autoupdate run
  #   env_file: cloudflared.env
  #   network_mode: service:crowsnest
  #   restart: unless-stopped
  #   depends_on: [crowsnest]

  # ---- Optional: on your tailnet with HTTPS (tailscale serve) --------------------------------
  # crowsnest shares the sidecar's network namespace, so `tailscale serve` reaches it on
  # loopback and the phone gets HTTPS (a secure context, which the microphone and the key bar's
  # paste need). Remove `ports:` above and add to the crowsnest service:
  #   network_mode: service:tailscale
  # set CROWSNEST_ALLOWED_HOSTS=crowsnest.<your-tailnet>.ts.net and CROWSNEST_TRUSTED_PROXY=loopback
  # in crowsnest.env (tailscale serve names the client in X-Forwarded-For, the default
  # CROWSNEST_TRUSTED_PROXY_HEADER; never cf-connecting-ip here, which a client could forge), and put
  # TS_AUTHKEY=... in deploy/tailscale.env (never in crowsnest.env).
  #
  # tailscale:
  #   image: tailscale/tailscale:latest
  #   hostname: crowsnest
  #   env_file: tailscale.env
  #   environment:
  #     TS_STATE_DIR: /var/lib/tailscale
  #     TS_SERVE_CONFIG: /config/serve.json   # {"TCP":{"443":{"HTTPS":true}},"Web":{"${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:2769"}}}}}
  #   volumes:
  #     - tailscale-state:/var/lib/tailscale
  #     - ./tailscale:/config
  #   devices: [/dev/net/tun]
  #   cap_add: [net_admin]
  #   restart: unless-stopped

# Unattended installs only:
# secrets:
#   crowsnest_password:
#     # Owned by uid 1000 (crow) and mode 0600: crowsnest refuses a password file others can read.
#     file: ./crowsnest_password

volumes:
  crowsnest-home:
  # tailscale-state:
